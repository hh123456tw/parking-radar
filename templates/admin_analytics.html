<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>維運儀表板｜停車地獄雷達</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin_analytics.css', v='admin-v2') }}">
</head>

<body>
  <header class="admin-header">
    <h1>維運儀表板</h1>
    <p class="admin-subtitle">唯讀管理頁面；所有行為統計僅包含同意匿名分析的使用者。</p>
    <nav class="range-nav" aria-label="日期範圍">
      <button type="button" class="range-button" data-range="today">今日</button>
      <button type="button" class="range-button" data-range="7d">7 天</button>
      <button type="button" class="range-button" data-range="30d">30 天</button>
    </nav>
  </header>
  <main>
    <section class="admin-section" aria-labelledby="system-heading">
      <h2 id="system-heading">系統狀態</h2>
      <p id="status-note" class="state-note">載入中…</p>
      <div id="system-strip" class="system-strip" aria-live="polite"></div>
    </section>

    <section class="admin-section" aria-labelledby="usage-heading">
      <h2 id="usage-heading">目前使用狀況</h2>
      <p id="analytics-note" class="state-note">載入中…</p>
      <div id="kpi-cards" class="kpi-grid" aria-live="polite"></div>
      <h3>查詢漏斗</h3>
      <ol id="funnel" class="funnel" aria-live="polite"></ol>
    </section>

    <section class="admin-section" aria-labelledby="destinations-heading">
      <h2 id="destinations-heading">使用者去哪裡</h2>
      <div class="table-grid">
        <section>
          <h3>熱門行政區</h3>
          <div class="table-scroll">
            <table class="admin-table">
              <thead><tr><th>行政區</th><th>查詢數</th></tr></thead>
              <tbody id="district-body"></tbody>
            </table>
          </div>
        </section>
        <section>
          <h3>熱門目的地</h3>
          <div class="table-scroll">
            <table class="admin-table">
              <thead><tr><th>目的地</th><th>查詢數</th></tr></thead>
              <tbody id="destination-body"></tbody>
            </table>
          </div>
        </section>
        <section>
          <h3>最常被導航的停車場</h3>
          <div class="table-scroll">
            <table class="admin-table">
              <thead><tr><th>停車場</th><th>次數</th><th>原推薦排名</th></tr></thead>
              <tbody id="lot-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>

    <section class="admin-section" aria-labelledby="improve-heading">
      <h2 id="improve-heading">系統哪裡需要改善</h2>
      <section>
        <h3>各階段耗時中位數</h3>
        <div class="table-scroll">
          <table class="admin-table stage-table">
            <thead><tr><th>解析</th><th>地址解析</th><th>資料確認</th><th>MySQL</th><th>步行路線</th></tr></thead>
            <tbody id="stage-body"></tbody>
          </table>
        </div>
      </section>
      <div class="table-grid">
        <section>
          <h3>失敗／降級原因</h3>
          <table class="admin-table">
            <thead><tr><th>原因</th><th>次數</th></tr></thead>
            <tbody id="outcome-body"></tbody>
          </table>
        </section>
        <section>
          <h3>模糊地點出現與選擇</h3>
          <table class="admin-table">
            <thead><tr><th>項目</th><th>次數</th></tr></thead>
            <tbody id="location-choice-body"></tbody>
          </table>
        </section>
      </div>
    </section>

    <section class="admin-section" aria-labelledby="recent-heading">
      <h2 id="recent-heading">最近查詢</h2>
      <div class="table-scroll">
        <table class="admin-table recent-table">
          <thead><tr><th>時間</th><th>輸入摘要</th><th>行政區</th><th>結果</th><th>總耗時</th><th>導航場站</th><th>回饋</th></tr></thead>
          <tbody id="recent-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='admin_analytics.js', v='admin-v2') }}"></script>
</body>

</html>
