# 管理儀表板專用存取日誌格式：只記錄時間、方法 + 路徑（不含查詢字串）、
# 協定、狀態、回應位元組與處理時間，完全省略用戶端 IP 與轉送來源。
log_format parking_no_ip '$time_iso8601 "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';

# 站台位於 Cloudflare 之後：只信任 Cloudflare 邊緣送來的 CF-Connecting-IP，
# 限流才會以真實使用者計算，而不是整個 Cloudflare 節點共用一個額度。
# 範圍來源：https://www.cloudflare.com/ips/（2026-09-28）
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# 限流鍵只存在記憶體中做速率限制，不會出現在任何日誌輸出。
limit_req_zone $binary_remote_addr zone=parking_admin_login:1m rate=5r/m;
# 儀表板資料 API 已通過 Basic Auth；切換區間會連續呼叫，給較寬的額度。
limit_req_zone $binary_remote_addr zone=parking_admin_api:1m rate=60r/m;
# 每次查詢會呼叫 Gemini、Nominatim 與 ORS；每人每分鐘 10 次足夠正常使用。
limit_req_zone $binary_remote_addr zone=parking_query:5m rate=10r/m;
# 匿名分析事件與回饋：防止灌假資料污染儀表板。
limit_req_zone $binary_remote_addr zone=parking_events:5m rate=60r/m;
