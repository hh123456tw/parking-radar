server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    access_log /var/log/nginx/parking-radar.access.log parking_no_ip;

    # 超過限流時回 JSON，前端可直接顯示中文訊息。
    limit_req_status 429;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        charset utf-8;
        return 429 '{"error":"查詢太頻繁，請稍候一分鐘再試"}';
    }

    location /static/ {
        alias /opt/parking-hell/static/;
        expires 1h;
        add_header X-Content-Type-Options nosniff;
    }

    # 查詢會呼叫付費或有額度限制的外部 API，必須限流。
    location = /api/query {
        limit_req zone=parking_query burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/analytics/ {
        limit_req zone=parking_events burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理儀表板：Basic Auth + 限流 + no-store；proxy 設定與公開站台相同。
    # 沒有斜線的 /admin 直接導向受保護的 /admin/，不得落入公開 proxy。
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        auth_basic "Parking Radar Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-parking-radar;
        limit_req zone=parking_admin_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    # 儀表板資料 API 同樣需要 Basic Auth，但給較寬的限流，避免切換區間時被擋。
    location /admin/api/ {
        auth_basic "Parking Radar Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-parking-radar;
        limit_req zone=parking_admin_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
