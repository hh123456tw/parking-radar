server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    access_log /var/log/nginx/parking-radar.access.log parking_no_ip;

    location /static/ {
        # static/sw.js 以 scope:/ 註冊，需允許擴張範圍才能啟用離線外殼。
        alias /opt/parking-hell/static/;
        expires 1h;
        add_header Service-Worker-Allowed /;
    }

    # 管理儀表板：Basic Auth + 限流 + no-store；proxy 設定與公開站台相同。
    # 沒有斜線的 /admin 直接導向受保護的 /admin/，不得落入公開 proxy。
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        auth_basic "Parking Radar Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-parking-radar;
        limit_req zone=parking_admin_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
