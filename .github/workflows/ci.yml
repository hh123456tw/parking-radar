name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check .
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt
      - name: Run Python tests with coverage
        run: python -m pytest -q --cov --cov-report=term --cov-fail-under=90
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/admin_analytics.js
          node --check templates/sw.js

  # master 通過所有檢查後自動部署；deploy 使用者只能上傳打包檔並觸發 VM 上預先安裝的 deploy.sh。
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Build release archive
        run: |
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          git archive --format=tar.gz -o release.tar.gz HEAD
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@${DEPLOY_HOST}" "$SHORT_SHA" < release.tar.gz | tee deploy.log
          grep -q "DEPLOY_OK sha=${SHORT_SHA}" deploy.log
